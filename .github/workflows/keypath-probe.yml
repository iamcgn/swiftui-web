# Scratch probe for the CriticalMaps TCA key path errors; runs only on pushes to its own files.
name: Key path probe
on:
  push:
    branches: ['claude/tca-keypath-probe']
    paths: ['Tools/KeyPathProbe/**', '.github/workflows/keypath-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    container: swift:6.3.3
    steps:
      - uses: actions/checkout@v4
      - name: Build each variant
        run: |
          cd Tools/KeyPathProbe
          for t in PercLocal TCALocal PercOurs TCAOurs; do
            echo "=== $t"
            swift build --target $t 2>&1 | grep -E "error:|warning:.*(key path|isolated)|Compiling $t|Build complete" || true
          done
  tca-source:
    runs-on: ubuntu-24.04
    steps:
      - name: Print the TCA lines CriticalMaps' sweep errors point at
        run: |
          git clone -q --depth 1 https://github.com/criticalmaps/criticalmaps-ios cm
          find cm -name Package.resolved | xargs grep -h -A8 '"swift-composable-architecture"' | head -12
          rev=$(find cm -name Package.resolved | xargs grep -h -A8 '"swift-composable-architecture"' | grep -m1 '"revision"' | grep -oE '[0-9a-f]{40}')
          echo "TCA revision $rev"
          git clone -q https://github.com/pointfreeco/swift-composable-architecture tca && git -C tca checkout -q "$rev"
          s=tca/Sources/ComposableArchitecture
          echo "=== Deprecations 520-575"; sed -n '520,575p' $s/Internal/Deprecations.swift
          echo "=== Store+Observation 640-700"; sed -n '640,700p' $s/Observation/Store+Observation.swift
          echo "=== NavigationStack+Observation 140-185"; sed -n '140,185p' $s/Observation/NavigationStack+Observation.swift
          echo "=== Store subscripts"; grep -n "subscript" $s/Observation/Store+Observation.swift | head -20
          echo "=== extension headers"; grep -n "^extension\|^@MainActor\|^#if\|^  #if\|^@available" $s/Observation/Store+Observation.swift $s/Observation/NavigationStack+Observation.swift
          echo "=== Store subscript 870-900"; sed -n '870,900p' $s/Observation/Store+Observation.swift
          prev=$(find cm -name Package.resolved | xargs grep -h -A8 '"swift-perception"' | grep -m1 '"revision"' | grep -oE '[0-9a-f]{40}')
          echo "Perception revision $prev"
          git clone -q https://github.com/pointfreeco/swift-perception per && git -C per checkout -q "$prev"
          for f in $(grep -rl "struct Bindable" per/Sources); do echo "=== $f"; grep -n -B12 -A3 "struct Bindable" $f; grep -n "subscript\|^#if\|^  #if\|canImport" $f; done
          echo "=== ViewStore removeDuplicates"; grep -n "removeDuplicates isDuplicate" $s/*.swift $s/*/*.swift | head
