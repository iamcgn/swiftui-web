# Builds Counter's release bundle at two commits, each also linked with a map, and lists what
# grew between them (Tools/Size/map-diff.py), so a change near the decision 0006 budget can be
# traced to the symbols it added. Run by hand, base is the commit to compare against and the
# workflow's own ref is the one compared; on a push that changes the tools, base is main's
# previous commit (what the last merge added). The bundles' brotli sizes go to the log too.
name: Size compare
on:
  push:
    paths: ['Tools/Size/map-diff.py', '.github/workflows/size-compare.yml']
  workflow_dispatch:
    inputs:
      base:
        description: Commit to compare against
        required: true
      app:
        description: Example package to build
        default: Examples/Counter
env:
  SWIFT_VERSION: 6.3.3
jobs:
  compare:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with: { path: head, fetch-depth: 0 }
      - name: Check out the base
        env: { BASE: "${{ inputs.base || 'origin/main~1' }}" }
        run: git -C head worktree add --detach "$GITHUB_WORKSPACE/base" "$BASE" && git -C base log -1 --oneline && git -C head log -1 --oneline
      - name: Install toolchain and wasm SDK
        run: |
          brew install swiftly binaryen brotli
          swiftly init --assume-yes --skip-install --no-modify-profile
          . ~/.swiftly/env.sh
          swiftly install $SWIFT_VERSION --use --assume-yes
          swift sdk install https://download.swift.org/swift-6.3.3-release/wasm-sdk/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE_wasm.artifactbundle.tar.gz \
            --checksum cabfa08b73bb8ac783927ecd15fa386e99d0c139c5f232445067bcf58379cae7
      - name: Build both, with maps
        env: { APP: "${{ inputs.app || 'Examples/Counter' }}" }
        run: |
          . ~/.swiftly/env.sh
          mkdir -p "$GITHUB_WORKSPACE/size"
          NAME=$(basename "$APP")
          for side in base head; do
            (
              cd "$GITHUB_WORKSPACE/$side"
              scripts/build-wasm.sh "$APP"
              scripts/size-gate.sh "$APP" 99999999 | sed "s|^|$side: |"
              # The map flag goes in the app's wasm-only linker settings (a command-line -Xlinker
              # also reaches the host macro tools' Apple ld, which has no --Map), as size-repro does.
              sed -i '' "s|\"stack-size=4194304\"|\"stack-size=4194304\", \"-Xlinker\", \"--Map=$GITHUB_WORKSPACE/size/$side.map\", \"-Xlinker\", \"--why-extract=$GITHUB_WORKSPACE/size/$side.why\"|" "$APP/Package.swift"
              # The same build script again, so the map's link has the side's own flags; only the
              # link reruns.
              scripts/build-wasm.sh "$APP" > "$GITHUB_WORKSPACE/size/$side-build.log" 2>&1 \
                || { tail -50 "$GITHUB_WORKSPACE/size/$side-build.log"; exit 1; }
              git checkout -- "$APP/Package.swift"
              cp "$APP/.build/wasm/wasm32-unknown-wasip1/release/$NAME.wasm" "$GITHUB_WORKSPACE/size/$side-linked.wasm"
              cp "$APP/.build/wasm/plugins/PackageToJS/outputs/Package/$NAME.wasm" "$GITHUB_WORKSPACE/size/$side.wasm"
            )
          done
          ls -l "$GITHUB_WORKSPACE/size"
      - name: The exports
        run: |
          for side in base head; do
            python3 head/Tools/Size/exports.py size/$side-linked.wasm --show 15
            python3 head/Tools/Size/exports.py size/$side.wasm --show 15
          done
      - name: Why the head pulled in archive members the base did not
        # wasm-ld's --why-extract lists, per extracted archive member, the object and symbol that
        # pulled it in. A member new at head whose reference is outside its own archive names the
        # caller that brought a library in.
        run: |
          . ~/.swiftly/env.sh
          python3 - size/base.why size/head.why <<'PY' | swift demangle --simplified | head -300
          import sys
          def rows(p):
              out = []
              for line in open(p):
                  parts = line.rstrip('\n').split('\t')
                  if len(parts) == 3 and parts[0] != 'reference':
                      out.append(parts)
              return out
          base = {r[1] for r in rows(sys.argv[1])}
          lib = lambda path: path.split('(')[0].rsplit('/', 1)[-1]
          for ref, member, sym in rows(sys.argv[2]):
              if member in base or lib(ref) == lib(member):
                  continue
              print(f"{ref.rsplit('/', 1)[-1]}  ->  {member.rsplit('/', 1)[-1]}  via {sym}")
          PY
      - name: What brings the Regex engine in
        # Scratch probe: every _StringProcessing or _RegexParser member pulled in from outside
        # those two archives, with the symbol that pulled it.
        run: |
          . ~/.swiftly/env.sh
          python3 - size/head.why <<'PY' | swift demangle --simplified | head -200
          import sys
          lib = lambda path: path.split('(')[0].rsplit('/', 1)[-1]
          regexy = ('libswift_StringProcessing.a', 'libswift_RegexParser.a')
          for line in open(sys.argv[1]):
              parts = line.rstrip('\n').split('\t')
              if len(parts) != 3 or parts[0] == 'reference':
                  continue
              ref, member, sym = parts
              if lib(member) in regexy and lib(ref) not in regexy:
                  print(f"{ref.rsplit('/', 1)[-1]}  ->  {member.rsplit('/', 1)[-1]}  via {sym}")
          PY
      - name: Every object that references the Regex engine's library
        # Scratch probe: extraction happens before --gc-sections, so any object naming a
        # _StringProcessing symbol (even from dead code) links the whole archive. List them all.
        run: |
          . ~/.swiftly/env.sh
          NM=$(find ~/.swiftly ~/Library/Developer/Toolchains /Library/Developer/Toolchains -name llvm-nm -type f 2>/dev/null | head -1)
          if [ -z "$NM" ]; then brew install llvm >/dev/null 2>&1; NM="$(brew --prefix llvm)/bin/llvm-nm"; fi
          echo "nm: $NM"
          LIB=$(grep -o '[^	]*libswift_StringProcessing\.a' size/head.why | head -1)
          echo "lib: $LIB"
          "$NM" --defined-only -j "$LIB" 2>/dev/null | sort -u > size/sp-defined.txt
          wc -l size/sp-defined.txt
          REL=head/Examples/Counter/.build/wasm/wasm32-unknown-wasip1/release
          find "$REL" -name '*.o' | while read -r o; do
            "$NM" -u -j "$o" 2>/dev/null | sort -u | comm -12 - size/sp-defined.txt | while read -r s; do
              echo "${o#$REL/}  $(echo "$s" | swift demangle --simplified)"
            done
          done | head -150
      - name: What changed
        run: . ~/.swiftly/env.sh && python3 head/Tools/Size/map-diff.py size/base.map size/head.map --top 80
