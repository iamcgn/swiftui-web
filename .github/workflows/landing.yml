name: Landing page

on:
  push:
    branches: [main]
    paths: ["Examples/Landing/**", "Sources/**", "Docs/support.json", "scripts/**", ".github/workflows/landing.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (swiftly + wasm SDK)
        run: scripts/bootstrap.sh
      - name: Build the landing page
        run: |
          . scripts/env.sh
          scripts/build-landing.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: Examples/Landing/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
