name: Landing page
# Builds Examples/Landing (release wasm bundle), the fixture gallery (Examples/Gallery, at
# /gallery/), the progress page (/progress/) and the three unmodified apps of decision 0021
# (/apps/<app>/) and publishes them as the gh-pages branch, which GitHub Pages serves at
# https://iamcgn.github.io/swiftui-web/ (repository settings: Pages source "Deploy from a branch",
# gh-pages, /). The same as running scripts/deploy-landing.sh locally. A macOS runner: SwiftUI-2048
# needs the Objective-C runtime wasm SDK (decision 0023), which exists for macOS arm64 only.
on:
  push:
    branches: [main]
    paths:
      - Examples/Landing/**
      - Examples/Gallery/**
      - Examples/Progress/**
      - Fixtures/**
      - Sources/**
      - Packages/**
      - Package.swift
      - Package.resolved
      - Docs/support.json
      - scripts/build-landing.sh
      - scripts/build-wasm.sh
      - scripts/deploy-landing.sh
      - scripts/gen-progress.py
      - Docs/todo.json
      - scripts/assets.py
      - Apps/**
      - .github/workflows/landing.yml
  workflow_dispatch:
concurrency:
  group: landing-pages
  cancel-in-progress: true
permissions:
  contents: write
env:
  SWIFT_VERSION: "6.3.3"
jobs:
  deploy:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }   # Apps/upstream: the apps at their pins
      - name: Install toolchain and the wasm SDKs (the stock one; the Objective-C runtime one of decision 0023 for SwiftUI-2048)
        run: |
          brew install swiftly binaryen brotli
          swiftly init --assume-yes --skip-install --no-modify-profile
          . ~/.swiftly/env.sh
          swiftly install $SWIFT_VERSION --use --assume-yes
          swift sdk install https://download.swift.org/swift-${SWIFT_VERSION}-release/wasm-sdk/swift-${SWIFT_VERSION}-RELEASE/swift-${SWIFT_VERSION}-RELEASE_wasm.artifactbundle.tar.gz \
            --checksum cabfa08b73bb8ac783927ecd15fa386e99d0c139c5f232445067bcf58379cae7
          swift sdk install https://github.com/iamcgn/swift-objc-wasm/releases/download/v0.1.1/swift-${SWIFT_VERSION}-RELEASE_wasm-objc.artifactbundle.tar.gz \
            --checksum d493aecef947d8a8a4d224264ace14d28a423677d949bcd756838c3080638328
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Cache the wasm builds
        uses: actions/cache@v4
        with:
          path: |
            Examples/Landing/.build/wasm
            Examples/Gallery/.build/wasm
            Examples/Progress/.build/wasm
            Apps/.build/wasm
            Apps/.build/wasm-objc
          key: landing-wasm-${{ runner.os }}-${{ env.SWIFT_VERSION }}-${{ hashFiles('Examples/Landing/Package.resolved', 'Package.resolved', 'Apps/Package.resolved') }}
          restore-keys: landing-wasm-${{ runner.os }}-${{ env.SWIFT_VERSION }}-
      - name: Build the site
        run: . ~/.swiftly/env.sh && scripts/build-landing.sh
      - name: Publish gh-pages
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: scripts/deploy-landing.sh --no-build "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
      - uses: actions/upload-artifact@v4
        with: { name: landing-dist, path: Examples/Landing/dist }
