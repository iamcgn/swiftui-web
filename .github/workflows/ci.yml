# Probe branch only (never merged): Counter's linked size at main and at PR 98, on Linux.
name: CI
on: push
jobs:
  size:
    runs-on: ubuntu-24.04
    container: swift:6.3.3
    steps:
      - uses: actions/checkout@v4
        with: { path: head, fetch-depth: 0 }
      - name: Base worktree
        run: git config --global --add safe.directory '*' && git -C head worktree add --detach "$GITHUB_WORKSPACE/base" 123d850
      - name: wasm SDK
        run: |
          swift sdk install https://download.swift.org/swift-6.3.3-release/wasm-sdk/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE_wasm.artifactbundle.tar.gz \
            --checksum cabfa08b73bb8ac783927ecd15fa386e99d0c139c5f232445067bcf58379cae7
      - name: Build both with maps
        run: |
          mkdir -p "$GITHUB_WORKSPACE/size"
          for side in base head; do
            cd "$GITHUB_WORKSPACE/$side/Examples/Counter"
            sed -i "s|\"stack-size=4194304\"|\"stack-size=4194304\", \"-Xlinker\", \"--Map=$GITHUB_WORKSPACE/size/$side.map\", \"-Xlinker\", \"--why-extract=$GITHUB_WORKSPACE/size/$side.why\"|" Package.swift
            swift build --swift-sdk swift-6.3.3-RELEASE_wasm --scratch-path .build/wasm -c release -Xswiftc -Osize \
              -Xswiftc -Xfrontend -Xswiftc -disable-incremental-llvm-codegen -Xswiftc -Xfrontend -Xswiftc -internalize-at-link \
              --product Counter 2>&1 | tail -5
            cp .build/wasm/wasm32-unknown-wasip1/release/Counter.wasm "$GITHUB_WORKSPACE/size/$side.wasm"
          done
          ls -l "$GITHUB_WORKSPACE/size"
      - name: Sections
        run: python3 head/Tools/Size/section-diff.py size/base.wasm size/head.wasm || true
      - name: New archive members at head
        run: |
          python3 - size/base.why size/head.why <<'PY' | swift demangle --simplified | head -200
          import sys
          def rows(p):
              return [l.rstrip('\n').split('\t') for l in open(p) if len(l.split('\t')) == 3 and not l.startswith('reference')]
          base = {r[1] for r in rows(sys.argv[1])}
          lib = lambda path: path.split('(')[0].rsplit('/', 1)[-1]
          for ref, member, sym in rows(sys.argv[2]):
              if member in base or lib(ref) == lib(member):
                  continue
              print(f"{ref.rsplit('/', 1)[-1]}  ->  {member.rsplit('/', 1)[-1]}  via {sym}")
          PY
      - name: What changed
        run: python3 head/Tools/Size/map-diff.py size/base.map size/head.map --top 120
