# The SceneKit WebGL experiment (Playwright/webgl/scene.mjs): builds Examples/SceneDemo and
# Counter (with this branch's drawMesh plumbing, and at PR 366's head without it), then draws
# each scene in headless Chromium on Linux by SceneKit's CPU path, the WebGL mesh renderer and
# its no-WebGL fallback, also under painter-gl.js (the WebGL painter for everything), and with
# WebGL switched off. Ubuntu runners only, so it never takes a Mac runner from CI.
#
# Playwright/webgl/reuse-run.txt, when it holds a run id, skips the builds and takes that run's
# bundles: the quick loop while only the painter changes.
name: WebGL SceneKit experiment
on:
  push:
    branches: ['claude/webgl-**']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      reuse: ${{ steps.r.outputs.reuse }}
    steps:
      - uses: actions/checkout@v4
      - id: r
        run: echo "reuse=$(cat Playwright/webgl/reuse-run.txt 2>/dev/null | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.reuse == ''
    runs-on: ubuntu-24.04
    container: swift:6.3.3
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: scenedemo, pkg: Examples/SceneDemo, flags: '', ref: '' }
          - { name: counter, pkg: Examples/Counter, flags: '', ref: '' }
          - { name: counter-base, pkg: Examples/Counter, flags: '', ref: '33c1a766cc2e56b929e5cf07ada1ab06c8d4cb4c' }
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ matrix.ref }}" }
      - name: Tools
        run: scripts/apt-install.sh python3
      - name: Install wasm SDK
        run: |
          swift sdk install https://download.swift.org/swift-6.3.3-release/wasm-sdk/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE_wasm.artifactbundle.tar.gz \
            --checksum cabfa08b73bb8ac783927ecd15fa386e99d0c139c5f232445067bcf58379cae7
      - name: Build ${{ matrix.name }}
        run: scripts/build-wasm.sh ${{ matrix.pkg }} ${{ matrix.flags }}
      - name: The served files
        run: |
          OUT="bundles/${{ matrix.name }}"
          mkdir -p "$OUT/.build/wasm/plugins/PackageToJS/outputs"
          cp "${{ matrix.pkg }}/index.html" "$OUT/"
          cp -R "${{ matrix.pkg }}/.build/wasm/plugins/PackageToJS/outputs/Package" "$OUT/.build/wasm/plugins/PackageToJS/outputs/"
          ls -la "$OUT/.build/wasm/plugins/PackageToJS/outputs/Package" | head -20
          for f in "$OUT"/.build/wasm/plugins/PackageToJS/outputs/Package/*.wasm; do echo "$(basename "$f"): $(stat -c %s "$f") bytes"; done
      - uses: actions/upload-artifact@v4
        with: { name: "bundle-${{ matrix.name }}", path: bundles, include-hidden-files: true, if-no-files-found: error, retention-days: 14 }

  scene:
    needs: [plan, build]
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.build.result == 'skipped' || needs.build.result == 'failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: 'bundle-*', path: bundles, merge-multiple: true, run-id: "${{ needs.plan.outputs.reuse || github.run_id }}", github-token: "${{ github.token }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Playwright
        run: cd Playwright && npm install && npx playwright install --with-deps chromium
      - name: Sizes (Counter with and without the drawMesh plumbing)
        run: |
          node Playwright/webgl/wasm-size.mjs bundles/*/.build/wasm/plugins/PackageToJS/outputs/Package/*.wasm
          node -e 'const z=require("zlib"),fs=require("fs"),s=fs.readFileSync("Sources/SceneKit/MeshScript.swift","utf8");console.log(`mesh renderer JS: ${s.length} bytes, ${z.brotliCompressSync(Buffer.from(s)).length} brotli (in SceneKit apps only)`)'
      - name: Serve the demo (plain, and with the WebGL painter for everything)
        run: |
          cp -R bundles/scenedemo served-plain
          Playwright/webgl/inject.sh bundles/scenedemo served-all blit
          python3 -m http.server 8811 --bind 127.0.0.1 --directory served-plain >/dev/null 2>&1 &
          python3 -m http.server 8812 --bind 127.0.0.1 --directory served-all >/dev/null 2>&1 &
          sleep 2
      - name: Scenes, CPU against WebGL against the no-WebGL fallback
        run: |
          mkdir -p .build/webgl-scene
          cd Playwright
          node webgl/scene.mjs "http://127.0.0.1:8811/index.html" --out ../.build/webgl-scene --json ../.build/webgl-scene/plain.json || true
          node webgl/scene.mjs "http://127.0.0.1:8812/index.html" --modes cpu,gl --label all --out ../.build/webgl-scene --json ../.build/webgl-scene/all.json || true
      - name: WebGL switched off
        run: |
          cd Playwright
          WEBGL_CHROME_ARGS="--disable-3d-apis" node webgl/scene.mjs "http://127.0.0.1:8811/index.html" --modes gl --label nowebgl --out ../.build/webgl-scene --json ../.build/webgl-scene/nowebgl.json || true
          WEBGL_CHROME_ARGS="--disable-3d-apis" node webgl/scene.mjs "http://127.0.0.1:8812/index.html" --modes gl --label all-nowebgl --scenes Spheres --out ../.build/webgl-scene --json ../.build/webgl-scene/all-nowebgl.json || true
      - name: Counter still paints
        run: |
          cp -R bundles/counter served-counter
          python3 -m http.server 8813 --bind 127.0.0.1 --directory served-counter >/dev/null 2>&1 &
          sleep 1
          cd Playwright && node counter.mjs "http://127.0.0.1:8813/index.html" --shot ../.build/webgl-scene/counter.png || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: webgl-scene, path: .build/webgl-scene, include-hidden-files: true, if-no-files-found: warn, retention-days: 14 }
