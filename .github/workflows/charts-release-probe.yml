# Scratch: builds ChartsExamples' release bundle (as CI's browser job does) on this probe branch,
# twice if needed, and runs wasm-opt by hand on a failure so its own error shows.
name: Charts release probe
on:
  push:
    branches: ['claude/size-cliff-probe']
    paths: ['.github/workflows/charts-release-probe.yml']
env:
  SWIFT_VERSION: 6.3.3
jobs:
  charts:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - name: Install toolchain and wasm SDK
        run: |
          brew install swiftly binaryen brotli
          swiftly init --assume-yes --skip-install --no-modify-profile
          . ~/.swiftly/env.sh
          swiftly install $SWIFT_VERSION --use --assume-yes
          swift sdk install https://download.swift.org/swift-6.3.3-release/wasm-sdk/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE_wasm.artifactbundle.tar.gz \
            --checksum cabfa08b73bb8ac783927ecd15fa386e99d0c139c5f232445067bcf58379cae7
      - name: Release build of ChartsExamples
        run: |
          . ~/.swiftly/env.sh
          sysctl hw.memsize; df -h . | tail -1
          for n in 1 2; do
            if scripts/build-wasm.sh Apps --product ChartsExamples > build-$n.log 2>&1; then echo "attempt $n: ok"; tail -5 build-$n.log; break; fi
            echo "attempt $n: failed"; tail -30 build-$n.log
            linked=$(ls Apps/.build/wasm/wasm32-unknown-wasip1/release/ChartsExamples.wasm 2>/dev/null)
            ls -l "$linked" Apps/.build/wasm/plugins/PackageToJS/outputs/Package.tmp/ 2>/dev/null || true
            nodwarf=Apps/.build/wasm/plugins/PackageToJS/outputs/Package.tmp/ChartsExamples.wasm.no-dwarf
            [ -f "$nodwarf" ] && { /usr/bin/time -l wasm-opt -Os --enable-bulk-memory --enable-sign-ext --enable-mutable-globals --enable-nontrapping-float-to-int "$nodwarf" -o /tmp/opt.wasm 2>&1 | tail -30; echo "wasm-opt exit ${PIPESTATUS[0]}"; }
            df -h . | tail -1
          done
          ls -l Apps/.build/wasm/plugins/PackageToJS/outputs/Package/*.wasm 2>/dev/null || true
