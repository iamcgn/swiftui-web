# Temporary probe (not for merging): Counter's linker map on main and on this branch, side by side.
name: Size reproducibility
on:
  push:
    paths: ['Tools/Size/**', '.github/workflows/size-repro.yml']
  workflow_dispatch:
env:
  SWIFT_VERSION: 6.3.3
jobs:
  counter-map:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Install toolchain and wasm SDK
        run: |
          brew install swiftly binaryen brotli
          swiftly init --assume-yes --skip-install --no-modify-profile
          . ~/.swiftly/env.sh
          swiftly install $SWIFT_VERSION --use --assume-yes
          swift sdk install https://download.swift.org/swift-6.3.3-release/wasm-sdk/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE_wasm.artifactbundle.tar.gz \
            --checksum cabfa08b73bb8ac783927ecd15fa386e99d0c139c5f232445067bcf58379cae7
      - name: Build Counter with a map, here and on main
        run: |
          . ~/.swiftly/env.sh
          mkdir -p $GITHUB_WORKSPACE/.build/size
          git worktree add $GITHUB_WORKSPACE/../main origin/main
          for n in branch main; do
            dir=$GITHUB_WORKSPACE; [ $n = main ] && dir=$GITHUB_WORKSPACE/../main
            (cd $dir
             sed -i '' "s|\"stack-size=4194304\"|\"stack-size=4194304\", \"-Xlinker\", \"--Map=$GITHUB_WORKSPACE/.build/size/$n.map\", \"-Xlinker\", \"--why-extract=$GITHUB_WORKSPACE/.build/size/$n.why\"|" Examples/Counter/Package.swift
             scripts/build-wasm.sh Examples/Counter
             scripts/size-gate.sh Examples/Counter 99999999)
          done
      - name: Breakdown
        run: |
          . ~/.swiftly/env.sh
          for n in main branch; do echo "######## $n"; python3 scripts/wasm-size-map.py .build/size/$n.map --top 60; done
      - name: Archive members extracted only on this branch
        run: |
          cd .build/size
          awk -F'\t' '{print $2}' main.why | sort -u > main.members
          awk -F'\t' '{print $2}' branch.why | sort -u > branch.members
          comm -13 main.members branch.members | head -200
          echo "######## why (first reference of each new member)"
          comm -13 main.members branch.members | while read m; do grep -F "	$m	" branch.why | head -1; done | head -200
