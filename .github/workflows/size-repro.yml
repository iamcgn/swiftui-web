# Builds the Counter release bundle twice from clean and compares the two wasm modules section by
# section: the same raw size has compressed to different brotli sizes across CI runs (a ~1.5 KB
# spread around the decision 0006 budget). Runs on changes to Tools/Size or by hand.
name: Size reproducibility
on:
  push:
    paths: ['Tools/Size/**', '.github/workflows/size-repro.yml']
  workflow_dispatch:
env:
  SWIFT_VERSION: 6.3.3
jobs:
  counter-twice:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain and wasm SDK
        run: |
          brew install swiftly binaryen brotli
          swiftly init --assume-yes --skip-install --no-modify-profile
          . ~/.swiftly/env.sh
          swiftly install $SWIFT_VERSION --use --assume-yes
          swift sdk install https://download.swift.org/swift-6.3.3-release/wasm-sdk/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE_wasm.artifactbundle.tar.gz \
            --checksum cabfa08b73bb8ac783927ecd15fa386e99d0c139c5f232445067bcf58379cae7
      - name: Build Counter twice from clean
        run: |
          . ~/.swiftly/env.sh
          mkdir -p .build/size
          for n in a b; do
            rm -rf Examples/Counter/.build
            scripts/build-wasm.sh Examples/Counter
            cp Examples/Counter/.build/wasm/plugins/PackageToJS/outputs/Package/Counter.wasm .build/size/$n.wasm
            scripts/size-gate.sh Examples/Counter 99999999
          done
      - name: Compare the two
        run: python3 Tools/Size/section-diff.py .build/size/a.wasm .build/size/b.wasm
      - name: What wasm-opt's strip passes would save
        run: |
          wasm-opt --enable-bulk-memory --enable-sign-ext --enable-mutable-globals --enable-nontrapping-float-to-int \
            --strip-debug --strip-producers .build/size/a.wasm -o .build/size/a-stripped.wasm || true
          for f in .build/size/a.wasm .build/size/a-stripped.wasm; do
            [ -f "$f" ] && echo "$f: raw $(stat -f%z "$f") brotli $(brotli -q 11 -c "$f" | wc -c | tr -d ' ')"
          done
