# Temporary probe (reverted in the next commit): prints Apple's AppIntents interface.
name: Size reproducibility
on:
  workflow_dispatch:
jobs:
  counter-twice:
    runs-on: macos-15
    steps:
      - name: AppIntents interface
        run: |
          X="$(ls -d /Applications/Xcode_*.app | grep -iv beta | sort -V | tail -1)"
          sudo xcode-select -s "$X" && xcodebuild -version
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          f=$(ls $SDK/System/Library/Frameworks/AppIntents.framework/Modules/AppIntents.swiftmodule/arm64e-apple-ios.swiftinterface)
          echo "=== AppIntents"
          sed -E 's/@available\([^)]*\) *//g; s/@_[A-Za-z]+(\([^)]*\))? *//g' "$f" | grep -vE '^\s*$|^\s*//' | grep -vE '^\s*(@backDeployed|#if|#else|#endif)'
          for m in WidgetKit SwiftUI SwiftUICore; do
            g=$(ls $SDK/System/Library/Frameworks/$m.framework/Modules/$m.swiftmodule/arm64e-apple-ios.swiftinterface)
            echo "=== $m"
            grep -nE "AppIntent|AppEntity|IntentResult|AppShortcut|SiriTip|ShortcutsLink" "$g" | sed -E 's/@available\([^)]*\) *//g' | head -200
          done
