name: Laptop hook read
# One-off: prints the laptop-sweep Mac's job-start hook so a change to it can be made exactly.
on:
  push:
    branches: [claude/laptop-hook-read]
permissions: {}
jobs:
  read:
    runs-on: [self-hosted, laptop-sweep]
    timeout-minutes: 3
    steps:
      - run: |
          ls -la ~/actions-runner/hooks/
          cat ~/actions-runner/hooks/job-started.sh
          grep -n ACTIONS_RUNNER_HOOK ~/actions-runner/.env 2>/dev/null || true
